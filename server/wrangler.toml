name = "nightwood"
main = "worker.js"
compatibility_date = "2025-09-01"

# the game itself: index.html, music/ and sfx/, copied here by `node build.mjs`
[assets]
directory = "./public"
binding = "ASSETS"

# one Durable Object per room code relays the players' messages
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
